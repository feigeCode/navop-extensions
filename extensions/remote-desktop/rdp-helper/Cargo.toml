[package]
name = "navop-rdp-helper"
version = "0.4.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["native-tls", "sound"]
native-tls = ["dep:native-tls", "ironrdp-client/native-tls"]
rustls = ["ironrdp-client/rustls"]
sound = ["ironrdp-client/sound"]

[dependencies]
anyhow = "1"
# Keep the RDP client compatible with legacy servers such as Windows Server 2008 R2.
# native-tls 0.2.15+ defaults to a TLS 1.2 minimum, while these servers may only
# offer TLS 1.0. This direct dependency constrains IronRDP's transitive native-tls
# dependency without changing its backend.
native-tls = { version = "=0.2.14", optional = true }
ironrdp = { git = "https://github.com/feigeCode/IronRDP", rev = "08587ebf8639c8737fda26bbc4660ad326d8e7ea", features = [
    "connector",
    "cliprdr",
    "graphics",
    "input",
    "pdu",
] }
ironrdp-client = { git = "https://github.com/feigeCode/IronRDP", rev = "08587ebf8639c8737fda26bbc4660ad326d8e7ea", default-features = false, features = [
    "clipboard",
] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
whoami = "1"
