[package]
name = "tdengine_driver"
version = "0.1.0"
edition = "2024"

# 扩展二进制名与 extension.build.json / driver.json entry 保持一致(tdengine-ipc-driver)。
[[bin]]
name = "tdengine-ipc-driver"
path = "src/main.rs"

[lib]
name = "tdengine_driver"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
extension-driver.workspace = true
extension-protocol.workspace = true
interprocess.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
tokio = { workspace = true, features = ["io-util", "rt-multi-thread", "macros", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

# taos WebSocket 通道(ws-rustls 纯 Rust 实现),经 taosAdapter 6041 端口连接。
taos.workspace = true

[dev-dependencies]
extension-host.workspace = true
tempfile = "3"
