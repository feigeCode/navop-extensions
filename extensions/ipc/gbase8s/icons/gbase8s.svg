<!-- GBase 8s 图标：圆形红底 + 白色字面，圆形不带任何描边。
     素材原本是「实心方块 + 镂空字形」（字形是方块上挖出的孔洞）。此处：
       1. 用实心红圆作底，只设 fill，不设 stroke；
       2. 字形轮廓单独作为一层白色填充浮在圆之上。
     两者必须分层：若改用「白色底圆 + 带孔的红圆」两层叠加，红圆边缘的抗锯齿
     会把下层白色混进来，在深色背景上能看到一圈极细白边。
     字形轮廓未做任何修改；前缀 M0 6270z 是零面积退化轮廓，作用只是把当前点
     落回 (0,6270)（与原方块起点一致），使其后相对 m 坐标的解析结果不变。
     仅使用路径填充 + fill-rule，不依赖 mask/clipPath/stroke。 -->
